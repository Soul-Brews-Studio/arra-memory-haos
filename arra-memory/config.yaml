name: "Arra Memory"
version: "0.10.2"
slug: "arra_memory"
description: >-
  A durable memory corpus that lives in your Home Assistant sidebar and answers
  to Claude over MCP. Memories are stored in an embedded libSQL database under
  the add-on's own /data, so they survive restarts and ride along in Home
  Assistant's backups.
url: "https://github.com/Soul-Brews-Studio/arra-memory-haos/tree/main/arra-memory"

# Prebuilt, not built on your Home Assistant host.
#
# Without this, Supervisor builds the add-on locally on every install: the
# Alpine base plus a ~90MB bun tarball over whatever connection that host has.
# It also reports a FAILED build as a successful update and leaves the old
# version running, because it reports the request rather than the result.
#
# {arch} is substituted by Supervisor. Both images are published public by
# .github/workflows/builder.yml on every push touching this add-on, and both
# were confirmed anonymously pullable before this line was added — pointing at
# a tag that does not exist breaks the installed add-on rather than the install.
image: "ghcr.io/soul-brews-studio/{arch}-addon-arra_memory"
arch:
  - amd64
  - aarch64
startup: application
# boot: auto — a host reboot leaves `boot: manual` add-ons stopped, and a
# stopped add-on reads as a failed install when it is nothing of the kind.
boot: auto
# The HA base image ships s6-overlay and owns PID 1 via ENTRYPOINT ["/init"].
init: false
hassio_api: false
homeassistant_api: false
host_network: false
# The sidebar panel. ingress_panel is still FALSE by default on a fresh install
# in some Supervisor versions — if the icon does not appear, that flag is why.
ingress: true
ingress_port: 8099
panel_icon: mdi:brain
panel_title: Memory
panel_admin: false
# A LAN port in addition to ingress, because ingress alone cannot serve MCP.
#
# Ingress authenticates with Home Assistant's own session and rewrites the path
# under a per-session token — fine for a browser, impossible for an MCP client,
# which has no HA session and must reach a stable URL with its own bearer or
# OAuth credentials. Nothing is exposed beyond the LAN by this: a Cloudflare
# Tunnel, if you use one, still dials outward and opens no inbound port.
#
# Set to null in the add-on's Network tab to close it and keep ingress only.
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "MCP endpoint and API for Claude Code, Codex, and tunnels"
# The corpus lives here. /data is the only path Supervisor persists across
# restarts AND includes in Home Assistant backups.
map:
  - data:rw
stage: experimental
options:
  # Owner passphrase for the web UI and for approving MCP clients. Generate one
  # (`openssl rand -base64 32`) and set it in this add-on's Configuration tab.
  # Blank means the add-on refuses to start rather than serving your memories
  # to anyone who finds the URL.
  owner_passphrase: ""
  # Optional static bearer token for scripts, curl, and MCP clients that read a
  # config file (Claude Code, Codex). claude.ai connectors CANNOT send a static
  # header and must use the OAuth flow instead — that is why both exist. Blank
  # disables this path entirely, leaving OAuth and the web session.
  api_token: ""
  # Optional public origin, e.g. https://memory.example.com — set ONLY when this
  # add-on is published through a tunnel and a remote MCP client needs absolute
  # OAuth URLs. Blank = derive every URL from the incoming request, which is
  # correct for LAN and ingress use.
  public_url: ""
  # Semantic search, off unless you point it at an Ollama server. It does NOT
  # have to be on this machine — a box on your LAN or private mesh is better,
  # since a HAOS host rarely has room for a model. Blank = keyword search only.
  ollama_url: ""
  # bge-m3 is the default because it is genuinely multilingual: measured on a
  # real corpus, a Thai sentence scores 0.84 cosine similarity against its own
  # English translation and 0.32 against unrelated Thai. That means an English
  # query finds a Thai memory. An English-first model cannot do that.
  embedding_model: "bge-m3"
  # Must match the model. bge-m3 is 1024; nomic-embed-text is 768. Changing this
  # after memories are embedded means re-embedding them — the column width is
  # fixed when the database is created.
  embedding_dimensions: 1024
  # Record every search — the query text AND which memories came back.
  #
  # Off by default, and that is not timidity. A search log is often more
  # revealing than the corpus it searches: what someone looked for says more
  # than what they wrote down. Turn it on when "what was I searching for last
  # week" is worth more to you than not keeping that record.
  # Manage it with the list_search_log and forget_search_log MCP tools.
  search_log: false
  # ── Turso embedded replica (optional) ──────────────────────────────────────
  # Leave blank for a purely local database.
  #
  # Set both and the add-on keeps its local file as the READ path — every query
  # still answered from disk, no network in the hot path — while libSQL
  # replicates against Turso in the background. The point is survival: catlab
  # can be lost entirely and the corpus is still in Turso.
  turso_sync_url: ""
  turso_auth_token: ""
  # Seconds between syncs. Low enough that another client sees a write soon,
  # high enough that an idle add-on is not chattering at the network.
  turso_sync_interval: 60
schema:
  owner_passphrase: password
  api_token: password
  # `str` and NOT `url?`: an optional URL key whose shipped default is ""
  # fails Supervisor's options validation BEFORE the container is created, so
  # the add-on never starts and its log is EMPTY — the only trace is one line
  # in the supervisor log. Learned the hard way, 2026-08-27.
  public_url: str
  ollama_url: str
  embedding_model: str
  embedding_dimensions: int
  search_log: bool
  turso_sync_url: str
  turso_auth_token: password
  turso_sync_interval: int
